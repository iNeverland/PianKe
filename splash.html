<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PianKe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      height: 300px;
      background: #08080d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      border-radius: 12px;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }
    .title {
      color: #e8e8f0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 4px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.2s forwards;
    }
    .subtitle {
      color: #6b6b7b;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.35s forwards;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #1e1e2a;
      border-top-color: #d4a853;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      opacity: 0;
      animation: spin 0.8s linear infinite, fadeIn 0.6s ease 0.5s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="16" fill="#d4a853" fill-opacity="0.12"/>
    <path d="M20 16L20 48L28 48L28 34L36 48L46 48L36 30L44 16L34 16L28 28L28 16L20 16Z" fill="#d4a853"/>
  </svg>
  <div class="title">片刻</div>
  <div class="subtitle">PIANKE</div>
  <div class="spinner"></div>
</body>
</html>
