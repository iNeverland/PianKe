# PianKe TMDB 代理 —— Nginx 反向代理配置
#
# 使用前替换占位符：
#   __DOMAIN__           例：tmdb.example.com
#   __APP_TOKEN_REGEX__  由 deploy.sh 从 /opt/pianke/server/.env 自动生成：
#                        单口令 → ^(口令)$；轮换过渡期 → ^(新口令|旧口令)$
#                        手工替换时切勿把占位符原样留在生产配置里。
#
# 本文件包含两段，由 `#=== TLS-SERVER ===` 分隔：
#   第 1 段 → /etc/nginx/sites-available/pianke-tmdb          （80 端口 + ACME 校验 + 反代）
#   第 2 段 → /etc/nginx/sites-available/pianke-tmdb-tls      （443 端口，证书就绪后才安装）
# 申请证书前必须只装第 1 段，否则 nginx 会报 "no ssl_certificate is defined"。
# certbot --nginx 会自动把 ssl_certificate 两行和 80→443 跳转写进第 1 段。

# 客户端请求会带随机 query（搜索词），不能按 URI 缓存；这里只做限流和转发。
limit_req_zone $binary_remote_addr zone=pianke_tmdb:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot --nginx 会接管这里做 ACME 校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 只允许本应用调用：固定 app token，避免域名被扫到后被人白嫖 TMDB 配额。
    # 注意：这只是一个轻量门槛，真正的防线是限流 + 用量监控。
    # __APP_TOKEN_REGEX__ 形如 ^(当前口令)$；轮换过渡期为 ^(新口令|旧口令)$
    # 两种凭据任一即可：共享口令，或 x-device-id（设备凭据由 Node 服务真正校验，
    # 这里只做存在性预过滤，不构成安全边界）。
    # 用「先默认拒绝、再逐条放行」的写法，避免嵌套 if（nginx 的 if 嵌套行为容易出意外）。
    set $pianke_unauthorized 1;
    if ($http_x_app_token ~ "__APP_TOKEN_REGEX__") {
        set $pianke_unauthorized 0;
    }
    if ($http_x_device_id != "") {
        set $pianke_unauthorized 0;
    }
    if ($pianke_unauthorized = 1) {
        return 401 '{"error":"未授权访问"}';
    }

    client_max_body_size 1m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location /api/ {
        limit_req zone=pianke_tmdb burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-app-token       $http_x_app_token;
        # 设备凭据：显式转发，避免依赖 nginx 的默认透传行为
        proxy_set_header x-device-id       $http_x_device_id;
        proxy_set_header x-device-token    $http_x_device_token;
    }

    # 健康检查：不需要 token，方便外部监控
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/api/healthz;
        access_log off;
    }
}

#=== TLS-SERVER ===
# 以下内容在证书签发成功后再安装为 /etc/nginx/sites-available/pianke-tmdb-tls
server {
    # nginx < 1.25.1 不支持 "http2 on;"，用 listen 参数写法兼容 Ubuntu 24.04 自带的 1.24
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # __APP_TOKEN_REGEX__ 形如 ^(当前口令)$；轮换过渡期为 ^(新口令|旧口令)$
    # 两种凭据任一即可：共享口令，或 x-device-id（设备凭据由 Node 服务真正校验，
    # 这里只做存在性预过滤，不构成安全边界）。
    # 用「先默认拒绝、再逐条放行」的写法，避免嵌套 if（nginx 的 if 嵌套行为容易出意外）。
    set $pianke_unauthorized 1;
    if ($http_x_app_token ~ "__APP_TOKEN_REGEX__") {
        set $pianke_unauthorized 0;
    }
    if ($http_x_device_id != "") {
        set $pianke_unauthorized 0;
    }
    if ($pianke_unauthorized = 1) {
        return 401 '{"error":"未授权访问"}';
    }

    client_max_body_size 1m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location /api/ {
        limit_req zone=pianke_tmdb burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-app-token       $http_x_app_token;
        # 设备凭据：显式转发，避免依赖 nginx 的默认透传行为
        proxy_set_header x-device-id       $http_x_device_id;
        proxy_set_header x-device-token    $http_x_device_token;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/api/healthz;
        access_log off;
    }
}
