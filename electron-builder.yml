appId: com.pianke.app
productName: PianKe
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - "!dist/win-unpacked"
  - "!dist/*.exe"
  - "!dist/*.blockmap"
  - "!dist/*.yml"
  - dist-electron/**/*
  - package.json
  - "!src/**"
extraResources:
  - from: src/assets/brand/PianKe.svg
    to: PianKe.svg
  - from: src/assets/brand/library-folder.svg
    to: 文件夹.svg
  - from: resources/tmdb-proxy.json
    to: tmdb-proxy.json
win:
  target: nsis
  icon: resources/icon.png
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
publish:
  # 发布地址由 CI 的 UPDATE_BASE_URL Secret 注入，避免将服务器域名写入仓库。
  # 例如：https://updates.example.com/pianke
  provider: generic
  url: ${env.UPDATE_BASE_URL}
fileAssociations:
  - ext: pianke
    name: PianKe Library
    description: PianKe 影视资源库
    role: Editor
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PianKe
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  uninstallDisplayName: PianKe
  include: build/installer.nsh
