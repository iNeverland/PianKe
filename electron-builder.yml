appId: com.pianke.app
productName: PianKe
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - "!dist/win-unpacked"
  - "!dist/*.exe"
  - "!dist/*.blockmap"
  - "!dist/*.yml"
  - dist-electron/**/*
  # 主进程产物已改名 main.cjs（Electron 34 内嵌的 Node 20.19.1 加载不了 ESM 入口，
  # 详见 vite.config.ts 的说明）。旧构建残留的 main.js 是 ES 模块，属于死文件，
  # 这里排除掉，避免它随安装包分发、也避免以后有人误以为它还在生效。
  - "!dist-electron/main.js"
  - package.json
  - "!src/**"
extraResources:
  - from: src/assets/brand/PianKe.svg
    to: PianKe.svg
  - from: src/assets/brand/library-folder.svg
    to: 文件夹.svg
  - from: resources/tmdb-proxy.json
    to: tmdb-proxy.json
win:
  target: nsis
  icon: resources/icon.png
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
publish:
  # 发布地址由 CI 的 UPDATE_BASE_URL Secret 注入，避免将服务器域名写入仓库。
  # 例如：https://updates.example.com/pianke
  provider: generic
  url: ${env.UPDATE_BASE_URL}
fileAssociations:
  - ext: pianke
    name: PianKe Library
    description: PianKe 影视资源库
    role: Editor
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PianKe
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  uninstallDisplayName: PianKe
  include: build/installer.nsh
