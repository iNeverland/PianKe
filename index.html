<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PianKe 片刻 — 个人影视日记" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light dark" />
    <!--
      移动端（Capacitor WebView）没有 Electron 主进程那层响应头 CSP，这里用 meta 补齐。
      必须是「Electron 生产 CSP 的超集」，否则两者取交集后会收紧桌面端行为：
      各指令都带上 file:，font-src 覆盖响应头 default-src 的回退，script-src 里的
      'unsafe-eval' 只为 Vite dev server 保留（Electron 生产响应头没有它，取交集后
      在打包产物里实际是禁用的）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: 'unsafe-eval'; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob: https:; font-src 'self' file: data:; connect-src 'self' file: https://pb.astara.space http://localhost:5173 ws://localhost:5173; object-src 'none'; base-uri 'none'"
    />
    <title>PianKe</title>
    <!-- 主题引导必须是外部脚本：生产 CSP 是 script-src 'self' file:，内联脚本会被拒绝执行（已实测） -->
    <script src="./theme-boot.js"></script>
    <style>
      /* 首屏关键 CSS：避免白屏与主题闪烁 */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f5f3ed;
        color: #1a1a1a;
        font-family: 'Geist Variable', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
      }
      html[data-theme="dark"] body {
        background: #0c0c0a;
        color: #f0ede5;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) body {
          background: #0c0c0a;
          color: #f0ede5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
